apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: filebeat
  namespace: elk

spec:

  selector:
    matchLabels:
      app: filebeat

  template:

    metadata:
      labels:
        app: filebeat

    spec:

      containers:

      - name: filebeat

        image: docker.elastic.co/beats/filebeat:8.12.0

        args:
        - -e
        - -c
        - /etc/filebeat.yml

        volumeMounts:

        - name: config
          mountPath: /etc/filebeat.yml
          subPath: filebeat.yml

        - name: varlog
          mountPath: /var/log

      volumes:

      - name: config

        configMap:
          name: filebeat-config

      - name: varlog

        hostPath:
          path: /var/log