- name: Deploy Learning Recommender
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:

    - name: Apply ConfigMap
      shell: kubectl apply -f ../k8s/app-configmap.yaml

    - name: Apply Secret
      shell: kubectl apply -f ../k8s/app-secret.yaml

    - name: Apply PostgreSQL PV
      shell: kubectl apply -f ../k8s/postgres-pv.yaml

    - name: Apply PostgreSQL PVC
      shell: kubectl apply -f ../k8s/postgres-pvc.yaml

    - name: Deploy PostgreSQL
      shell: kubectl apply -f ../k8s/postgres-deployment.yaml

    - name: PostgreSQL Service
      shell: kubectl apply -f ../k8s/postgres-service.yaml

    - name: Deploy Backend Services
      shell: kubectl apply -f ../k8s/user-deployment.yaml &&
             kubectl apply -f ../k8s/user-service.yaml &&
             kubectl apply -f ../k8s/feedback-deployment.yaml &&
             kubectl apply -f ../k8s/feedback-service.yaml &&
             kubectl apply -f ../k8s/recommendation-deployment.yaml &&
             kubectl apply -f ../k8s/recommendation-service.yaml &&
             kubectl apply -f ../k8s/gateway-deployment.yaml &&
             kubectl apply -f ../k8s/gateway-service.yaml

    - name: Deploy Frontend
      shell: kubectl apply -f ../k8s/frontend-deployment.yaml

    - name: Frontend Service
      shell: kubectl apply -f ../k8s/frontend-service.yaml

    - name: Prometheus Config
      shell: kubectl apply -f ../k8s/prometheus-configmap.yaml

    - name: Prometheus Deployment
      shell: kubectl apply -f ../k8s/prometheus-deployment.yaml

    - name: Prometheus Service
      shell: kubectl apply -f ../k8s/prometheus-service.yaml
